# Intégration continue d'UniFlow Desktop : un seul fichier, des jobs chaînés.
#
# `qualite` garde la porte (format, analyse, tests) ; les trois builds ne
# démarrent que s'il passe, et `release` ne publie que sur un tag `v*`.
# Voir docs/integration-continue.md.
name: UniFlow Desktop

on:
  push:
    branches: [main, feature/frontend-uniflow-app]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule le run précédent : les builds
# Windows et Android durent plusieurs minutes, les laisser courir pour un
# commit déjà remplacé gaspille les minutes du dépôt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  qualite:
    name: Qualité (format, analyse, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse statique
        run: flutter analyze
      - name: Tests
        run: flutter test --coverage

  build-linux:
    name: Build Linux
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: |
          sudo apt-get update
          # libwebkit2gtk-4.1-dev est requis par `desktop_webview_window`, tiré par
          # `flutter_web_auth_2` lui-même tiré par le SDK Appwrite. Sans lui, CMake
          # échoue sur `pkg_check_modules(webkit2gtk-4.0)` et le build Linux casse.
          # libpulse-dev : le plugin flutter_webrtc (visioconférence) lie PulseAudio
          # quand il le trouve ; sans les en-têtes, l'édition de liens échoue.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libwebkit2gtk-4.1-dev libpulse-dev
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Fichier .env (Appwrite Cloud)
        run: bash .github/scripts/write-env.sh
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_STORAGE_BUCKET_ID: ${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}
          APPWRITE_API_FUNCTION_ID: ${{ secrets.APPWRITE_API_FUNCTION_ID }}
      - run: flutter build linux --release
      - name: Archive du bundle
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/uniflow-desktop-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-linux
          path: dist/uniflow-desktop-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows (installateur .exe)
    needs: qualite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Fichier .env (Appwrite Cloud)
        shell: bash
        run: bash .github/scripts/write-env.sh
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_STORAGE_BUCKET_ID: ${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}
          APPWRITE_API_FUNCTION_ID: ${{ secrets.APPWRITE_API_FUNCTION_ID }}
      - name: Inno Setup 6
        shell: powershell
        # `flutter_distributor` ne compresse rien lui-même : il engendre un
        # script Inno Setup depuis windows/packaging/exe/make_config.yaml puis
        # appelle ISCC.exe. Sans Inno installé, le maker `exe` lève
        # « Inno Setup 6 was not installed ».
        run: choco install innosetup --no-progress -y
      - name: Compilation de l'installateur
        shell: pwsh
        # Le même appel que sur le poste d'un développeur Windows, à ceci près
        # que la version vient du pubspec (l'outil lit `pubspec.yaml` lui-même).
        # `--no-version-check` : par défaut l'outil interroge pub.dev à chaque
        # lancement et imprime un spinner — une dépendance réseau de plus,
        # gratuite à supprimer.
        # `dart pub global run flutter_distributor:main` plutôt que le shim
        # `flutter_distributor.bat` : le répertoire `bin` de pub global n'est
        # pas dans le PATH du runner, et `executables:` mappe
        # `flutter_distributor` sur `bin/main.dart`.
        run: |
          $ErrorActionPreference = 'Stop'
          # Version épinglée : c'est celle dont le comportement a été lu dans
          # `.pub-cache` (le maker `exe`, ses noms de champs, son dossier de
          # sortie). Une montée de version doit être un choix, pas une surprise
          # de la CI.
          dart pub global activate flutter_distributor 0.6.10
          dart pub global run flutter_distributor:main --no-version-check `
            package --platform windows --targets exe --skip-clean
          if ($LASTEXITCODE -ne 0) {
            throw "flutter_distributor a rendu le code $LASTEXITCODE."
          }
          # L'appel sort en code 0 même quand aucun paquet n'a été produit (il
          # se contente d'un avertissement si une étape est sautée) : c'est
          # l'étape suivante qui attrape le problème, pas celle-ci.
          # L'outil range le paquet dans `dist/<version>/` (ici
          # `dist/1.0.0+1/`) : il faut donc chercher en profondeur, le motif
          # `dist\*-windows-setup.exe` ne correspondrait à rien.
          $setup = Get-ChildItem "$($env:GITHUB_WORKSPACE)\dist" -Recurse -Filter '*-windows-setup.exe' |
            Select-Object -First 1
          if (-not $setup) {
            throw "Aucun installateur sous dist/ après flutter_distributor."
          }
          # Transmis à l'étape de vérification : reconstruire le motif `1.0.0+1`
          # en PowerShell serait plus fragile que de le garder en mémoire ici.
          "SETUP_EXE=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Installation silencieuse, vérification, désinstallation
        shell: pwsh
        # Le Store et winget n'acceptent pas un installateur qu'ils ne savent pas
        # poser sans interaction ni retirer proprement. Ces trois vérifications
        # sont ce que leurs bots rejouent : les jouer ici évite une semaine
        # d'allers-retours avec un `Needs-Author-Feedback`.
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item $env:SETUP_EXE

          # Dossier d'installation imposé par /DIR : rien n'est deviné de
          # l'emplacement par défaut ni du contexte de sécurité du runner.
          # `privileges_required: none` dans make_config.yaml => pose par
          # utilisateur, donc la clé d'installation est en HKCU et il n'y a pas
          # d'élévation à attendre (c'est aussi ce qui la rend possible sur un
          # poste d'élève sans droit administrateur).
          $cible = "$env:RUNNER_TEMP\uniflow-installation-essai"
          $install = Start-Process $exe.FullName `
            -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES',"/DIR=$cible" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installation silencieuse refusée : code retour $($install.ExitCode)."
          }

          $binaire = Join-Path $cible 'uniflow_app.exe'
          if (-not (Test-Path $binaire)) {
            throw "uniflow_app.exe absent de $binaire après installation."
          }
          $cle = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\codes.kernelforge.uniflow_is1'
          if (-not (Test-Path $cle)) {
            throw "Entrée de désinstallation absente du registre : winget ne verrait pas le paquet."
          }

          $desinstall = Start-Process (Join-Path $cible 'unins000.exe') `
            -ArgumentList '/VERYSILENT','/NORESTART' -Wait -PassThru
          if ($desinstall.ExitCode -ne 0) {
            throw "Désinstallation silencieuse refusée : code retour $($desinstall.ExitCode)."
          }
          if (Test-Path $binaire) { throw "Le binaire survit à la désinstallation." }

          # Ces valeurs sont celles qu'exige une demande winget (chemin, hachage,
          # commutateurs) et le formulaire « Packages » du Store.
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $taille = '{0:N1} Mo' -f ($exe.Length / 1MB)
          @(
            "### Installateur Windows",
            "",
            "| Champ | Valeur |",
            "| --- | --- |",
            "| Fichier | ``$($exe.Name)`` |",
            "| Taille | ``$taille`` |",
            "| InstallerSha256 | ``$sha`` |",
            "| Silent / SilentWithProgress | ``/VERYSILENT /SUPPRESSMSGBOXES /NORESTART`` |",
            "| Code de retour installation réussie | ``0`` |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-windows
          path: dist/**/*-windows-setup.exe
          if-no-files-found: error
          retention-days: 3

  build-android-tablet:
    name: Build Android (tablette)
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          # Java 21 : compatible avec Gradle 9.1 et au-dessus du minimum exigé
          # par AGP 9.0.1. Le projet compile de toute façon en bytecode 17.
          java-version: '21'
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Fichier .env (Appwrite Cloud)
        run: bash .github/scripts/write-env.sh
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_STORAGE_BUCKET_ID: ${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}
          APPWRITE_API_FUNCTION_ID: ${{ secrets.APPWRITE_API_FUNCTION_ID }}
      - run: flutter build apk --release
      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/uniflow-desktop-tablette.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-android-tablette
          path: dist/uniflow-desktop-tablette.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publication GitHub
    needs: [build-linux, build-windows, build-android-tablet]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/uniflow-desktop-linux-x64.tar.gz
            dist/**/*-windows-setup.exe
            dist/uniflow-desktop-tablette.apk
          generate_release_notes: true

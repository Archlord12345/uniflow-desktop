name: UniFlow Desktop & Tablet Build

on:
  push:
    branches: [ main, feature/frontend-uniflow-app ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Linux Build (Deb/Rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          # libwebkit2gtk-4.1-dev est requis par `desktop_webview_window`, tire par
          # `flutter_web_auth_2` lui-meme tire par le SDK Appwrite. Sans lui, CMake
          # echoue sur `pkg_check_modules(webkit2gtk-4.0)` et le build Linux casse.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libwebkit2gtk-4.1-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env file
        run: |
          echo "APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}" >> .env
          echo "APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}" >> .env
          echo "APPWRITE_DATABASE_ID=${{ secrets.APPWRITE_DATABASE_ID }}" >> .env
          echo "APPWRITE_STORAGE_BUCKET_ID=${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}" >> .env
      - name: Build Linux
        run: flutter build linux --release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Desktop-Linux
          path: build/linux/x64/release/bundle/

  build-windows:
    name: Windows Build (Exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env file
        shell: bash
        run: |
          echo "APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}" >> .env
          echo "APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}" >> .env
          echo "APPWRITE_DATABASE_ID=${{ secrets.APPWRITE_DATABASE_ID }}" >> .env
          echo "APPWRITE_STORAGE_BUCKET_ID=${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}" >> .env
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Desktop-Windows
          path: build/windows/x64/runner/Release/

  build-tablet:
    name: Android Tablet Build (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # Java 21 : compatible a la fois avec Gradle 8.14 (mobile) et 9.1 (desktop),
          # et au-dessus du minimum exige par AGP 9.0.1. Le projet compile de toute
          # facon en bytecode 17 (app/build.gradle.kts).
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env file
        run: |
          echo "APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}" >> .env
          echo "APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}" >> .env
          echo "APPWRITE_DATABASE_ID=${{ secrets.APPWRITE_DATABASE_ID }}" >> .env
          echo "APPWRITE_STORAGE_BUCKET_ID=${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}" >> .env
      - name: Build APK
        run: flutter build apk --release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Desktop-Tablet-APK
          path: build/app/outputs/flutter-apk/app-release.apk

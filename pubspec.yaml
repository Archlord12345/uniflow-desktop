name: uniflow
description: Plateforme de gestion académique intelligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0 # utilisé pour le graphique "Inscriptions par mois" du dashboard
  flutter_dotenv: ^6.0.1
  appwrite: ^26.2.0
  flutter_riverpod: ^2.6.1
  # `file_selector` plutôt qu'`image_picker` : c'est le paquet soutenu par
  # l'équipe Flutter pour Linux et Windows, où `image_picker` est peu fiable.
  file_selector: ^1.0.3
  # Signature des jetons d'accès LiveKit (HMAC-SHA256) par le service de
  # visioconférence embarqué. Déjà présent en dépendance transitive ; déclaré
  # explicitement puisqu'on l'importe directement.
  crypto: ^3.0.7
  # Ouverture des liens GitHub et mailto: depuis la page Équipe. Déjà présent
  # sur le mobile ; le desktop l'ignorait, ses liens n'étaient pas cliquables.
  url_launcher: ^6.3.2
  # Dossier de données de l'application, pour l'instantané de session et les
  # préférences : importé par `session_snapshot.dart` sans être déclaré,
  # l'analyseur le signalait (`depend_on_referenced_packages`).
  path_provider: ^2.1.5
  # Préférences locales réelles de l'écran Paramètres (thème, notifications,
  # dernier écran) : les interrupteurs étaient auparavant figés.
  shared_preferences: ^2.5.3
  # Client LiveKit : c'est lui qui rejoint la salle hébergée par le poste
  # (flutter_webrtc est sa dépendance, prise en charge sur Linux, Windows,
  # macOS et Android).
  livekit_client: ^2.13.0
  # QR code du lien de participation affiché à l'hôte, pour qu'un téléphone du
  # réseau local rejoigne la salle sans recopier l'adresse.
  qr_flutter: ^4.1.0
  # Exports de la feuille de présence d'une réunion, produits sur le poste
  # (donc disponibles hors ligne) : un PDF à imprimer ou joindre, un classeur
  # à retravailler par le secrétariat.
  pdf: ^3.12.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Logos de marque détourés (fond transparent) : l'écusson carré pour les
    # icônes, le logotype horizontal pour les surfaces larges et claires.
    - assets/brand/
    # Page web de participation à une visioconférence, servie par le poste hôte
    # aux navigateurs du réseau local (bundle livekit-client inclus, Apache-2.0).
    - assets/conference_web/
    # Uni, la mascotte (12 poses WebP), son avatar et le logo KERNEL FORGE :
    # embarqués pour s'afficher hors ligne et sur les écrans d'erreur, là où
    # rien ne peut plus être téléchargé.
    - assets/mascot/
    - assets/assistant/
    - assets/logos/
    - assets/onboarding/
    - .env
  # Inter (SIL OFL 1.1, licence dans assets/fonts/) : la police du web.
  # Le thème la nommait sans l'embarquer et Flutter retombait sur la police
  # système, d'où un desktop qui ne ressemblait pas au web.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
